<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeMart Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2 class="auth-title">BeeMart Login</h2>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Masukkan username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Masukkan password" required autocomplete="current-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Role</label>
          <select id="role" class="form-select" required>
            <option value="Admin">Admin</option>
            <option value="Cashier" selected>Kasir</option>
          </select>
        </div>

        <button type="submit" id="btnLogin" class="btn-primary">Login</button>

        <div class="auth-footer">
          <a href="register.html" class="auth-link">Belum punya akun? Register</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await initConfig();
      // If already logged in, redirect to main page
      const session = getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      if (!username || !password) {
        showToast('Username dan Password wajib diisi.', 'warning');
        return;
      }

      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerText = 'Memproses...';

      const res = await apiCall('/api/v1/auth/login', 'POST', { username, password, role });
      btn.disabled = false;
      btn.innerText = 'Login';

      if (!res.ok) {
        showToast(res.message || 'Invalid login', 'error');
        return;
      }

      setSession(res.data);
      showToast('Login berhasil!', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    }
  </script>
</body>
</html>
